version: "3.9"

services:
  backend:
    image: ai-interview-backend:prod
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai-interview-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    volumes:
      - ./backend/media:/app/media
    depends_on:
      - redis

  celery-worker:
    image: ai-interview-backend:prod
    container_name: ai-interview-celery
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    volumes:
      - ./backend/media:/app/media
    depends_on:
      - redis
    command: ["celery", "-A", "AI_Interview", "worker", "-l", "info"]

  redis:
    image: redis:7-alpine
    container_name: ai-interview-redis
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: ai-interview-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
