<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- 浅绿色背景渐变 -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3f8f5" />
      <stop offset="60%" stop-color="#e8f2ec" />
      <stop offset="100%" stop-color="#dceae2" />
    </linearGradient>
    
    <!-- 树冠及树干（更柔和清晰） -->
    <g id="tree">
      <polygon points="15,0 30,40 22,40 35,80 5,80 18,40 0,40" />
      <rect x="13" y="80" width="4" height="20" fill="#aabcd2" />
    </g>

    <!-- 近景草地上的小草丛簇 -->
    <g id="grass-tuft">
      <path d="M10,20 Q12,5 20,0 Q18,10 25,20 Z" />
      <path d="M10,20 Q8,8 0,5 Q5,12 5,20 Z" />
    </g>

  </defs>

  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- 远景山脉与雾气层（低透明度） -->
  <path d="M0,650 Q480,500 960,680 T1920,580 L1920,1080 L0,1080 Z" fill="#d0dfd7" opacity="0.6"/>
  <path d="M0,720 Q480,850 960,720 T1920,850 L1920,1080 L0,1080 Z" fill="#c3d8ce" opacity="0.8"/>

  <!-- 远端树木（浅灰色） -->
  <g fill="#bbcbd1" opacity="0.5">
    <use href="#tree" x="150" y="300" transform="scale(2.2)" />
    <use href="#tree" x="350" y="320" transform="scale(1.8)" />
    <use href="#tree" x="550" y="280" transform="scale(2.5)" />
    <use href="#tree" x="800" y="330" transform="scale(1.6)" />
    <use href="#tree" x="1150" y="270" transform="scale(2.7)" />
    <use href="#tree" x="1450" y="310" transform="scale(2.0)" />
    <use href="#tree" x="1750" y="290" transform="scale(2.3)" />
  </g>

  <!-- 中层丘陵与草地（增加画面充实度） -->
  <path d="M-100,800 Q300,720 750,830 T1450,760 T2000,840 L2000,1080 L-100,1080 Z" fill="#b9d6c7" opacity="0.85"/>
  <path d="M-100,860 Q400,920 850,810 T1550,880 T2000,790 L2000,1080 L-100,1080 Z" fill="#a4c9b5" opacity="0.9"/>

  <!-- 中端树木（偏绿灰，立于丘陵之间） -->
  <g fill="#9fc1b4" opacity="0.8">
    <use href="#tree" x="80" y="380" transform="scale(3.2)" />
    <use href="#tree" x="280" y="440" transform="scale(2.1)" />
    <use href="#tree" x="480" y="370" transform="scale(3.0)" />
    <use href="#tree" x="680" y="440" transform="scale(1.9)" />
    <use href="#tree" x="880" y="400" transform="scale(2.6)" />
    <use href="#tree" x="1230" y="370" transform="scale(3.5)" />
    <use href="#tree" x="1530" y="420" transform="scale(2.4)" />
    <use href="#tree" x="1830" y="390" transform="scale(2.9)" />
  </g>

  <!-- 近景丰满大草地地形（最浅/最饱和颜色，奠定坚实底部） -->
  <path d="M-100,960 Q250,860 700,930 T1400,880 T2000,950 L2000,1100 L-100,1100 Z" fill="#8cb39d" />
  <path d="M-100,1010 Q400,940 900,1020 T1700,960 T2000,1000 L2000,1100 L-100,1100 Z" fill="#7a9e88" />

  <!-- 近顶点缀的小草细节 -->
  <g fill="#608670" opacity="0.6">
    <use href="#grass-tuft" x="150" y="1030" transform="scale(1.5)" />
    <use href="#grass-tuft" x="380" y="980" transform="scale(1.2)" />
    <use href="#grass-tuft" x="650" y="1040" transform="scale(1.8)" />
    <use href="#grass-tuft" x="850" y="1000" transform="scale(1.4)" />
    <use href="#grass-tuft" x="1200" y="1050" transform="scale(2.0)" />
    <use href="#grass-tuft" x="1500" y="990" transform="scale(1.3)" />
    <use href="#grass-tuft" x="1750" y="1030" transform="scale(1.6)" />
  </g>
</svg>