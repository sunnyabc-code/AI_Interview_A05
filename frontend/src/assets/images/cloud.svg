<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <filter id="cloud-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="20" />
    </filter>
  </defs>
  <!-- 底层发光厚雾 -->
  <g fill="#ffffff" filter="url(#cloud-blur)" opacity="1">
    <circle cx="200" cy="200" r="100" />
    <circle cx="300" cy="120" r="120" />
    <circle cx="450" cy="180" r="110" />
    <circle cx="500" cy="250" r="80" />
    <circle cx="150" cy="280" r="80" />
    <rect x="150" y="150" width="350" height="150" rx="75" />
  </g>
  <!-- 顶层纯白色增加体积感 -->
  <g fill="#ffffff" filter="url(#cloud-blur)" opacity="0.95">
    <circle cx="220" cy="220" r="80" />
    <circle cx="320" cy="150" r="100" />
    <circle cx="420" cy="190" r="90" />
    <rect x="200" y="170" width="220" height="100" rx="50" />
  </g>
</svg>
