[pytest]
DJANGO_SETTINGS_MODULE = AI_Interview.test_settings

# 测试文件查找规则
python_files = test_*.py *_test.py tests.py
python_classes = Test*
python_functions = test_*

# 测试目录
testpaths = .

# 标记定义
markers =
    slow: 标记慢速测试（如涉及 LLM 调用的测试）
    unit: 单元测试
    integration: 集成测试
    smoke: 冒烟测试——只验证核心链路可用
    llm: 需要真实 LLM API Key 的测试（默认跳过）

# 输出选项
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:cacheprovider
    --ignore=scripts

# 覆盖率配置
[coverage:run]
source = .
omit =
    */migrations/*
    */tests/*
    */__pycache__/*
    manage.py
    */admin.py
    */apps.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    def __str__
    raise NotImplementedError
    if __name__ == .__main__.:
